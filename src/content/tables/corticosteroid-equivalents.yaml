footnotes:
  - id: a
    text: "Equivalent doses are for oral or IV administration. Relative potency for intramuscular or intraocular use may vary considerably."
    refs: [liu2013]
  - id: b
    text: "Used for mineralocorticoid replacement. Glucocorticoid doses with a mineralocorticoid effect roughly equal to fludrocortisone 0.1 mg: prednisone or prednisolone 50 mg, or hydrocortisone 20 mg."
    refs: [liu2013]
caveats:
  - "Equivalences are approximate and based on anti-inflammatory potency. Duration of action, mineralocorticoid effect, and HPA axis suppression differ between agents."
references:
