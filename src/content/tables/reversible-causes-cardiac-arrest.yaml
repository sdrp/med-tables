footnotes:
  - id: a
    text: "Hydrogen ion appears in the traditional AHA ACLS H's and T's. The RCUK mnemonic folds metabolic causes into a single H. Reviewer: confirm the AHA list against the 2025 Adult ALS algorithm figure."
    refs: [aha2025, rcuk2025]
  - id: b
    text: "RCUK lists hypo- and hyperthermia together."
    refs: [rcuk2025]
caveats:
  - "Identify and treat reversible causes without delaying high-quality CPR or defibrillation."
  - "AHA 2025: using point-of-care ultrasound during arrest to diagnose reversible causes is not well established (COR 2b, LOE C-LD). If used, minimize interruptions in compressions."
