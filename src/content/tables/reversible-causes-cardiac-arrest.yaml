title: Reversible Causes of Cardiac Arrest (H's and T's)
slug: reversible-causes-cardiac-arrest
category: Resuscitation
summary: The H's and T's to search for and treat during every cardiac arrest, as framed by AHA (US) and Resuscitation Council UK.
status: draft
reviewed_by: Pending
columns:
  - key: group
    label: Group
  - key: cause
    label: Cause
  - key: rcuk
    label: Grouping in RCUK 4 H's and 4 T's
rows:
  - cells:
      group: "H"
      cause: "Hypoxia"
      rcuk: "Hypoxia"
  - cells:
      group: "H"
      cause: "Hypovolemia"
      rcuk: "Hypovolaemia"
  - cells:
      group: "H"
      cause: { text: "Hydrogen ion (acidosis)", notes: [a] }
      rcuk: { text: "Not listed separately", notes: [a] }
  - cells:
      group: "H"
      cause: "Hypo- or hyperkalemia (and other metabolic disturbances)"
      rcuk: "Hypo/hyperkalaemia, metabolic"
  - cells:
      group: "H"
      cause: { text: "Hypothermia", notes: [b] }
      rcuk: "Hypo/hyperthermia"
  - cells:
      group: "T"
      cause: "Tension pneumothorax"
