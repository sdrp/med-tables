title: Guideline-Directed Medical Therapy for HFrEF (Four Pillars)
slug: hfref-gdmt-four-pillars
category: Cardiology
summary: The four drug classes of foundational therapy for heart failure with reduced ejection fraction, with examples, key trials, when not to start, and what to monitor.
status: draft
reviewed_by: Pending
columns:
  - key: drug_class
    label: Pillar and class
  - key: examples
    label: Examples (generic, US trade name)
  - key: trials
    label: Key trials
  - key: mortality
    label: All-cause mortality RRR
    unit: "%"
  - key: avoid
    label: Do not start, or contraindicated
  - key: notes
    label: Monitoring and other notes
rows:
  - cells:
      drug_class: { text: "Pillar 1, RAAS inhibition: ARNi (preferred)", notes: [a] }
      examples: "Sacubitril/valsartan (Entresto)"
      trials: { text: "PARADIGM-HF", notes: [b] }
      mortality: { text: "16", notes: [c] }
      avoid: { text: "Any history of angioedema. With an ACEi, or within 36 h of the last ACEi dose. With aliskiren in diabetes. Pregnancy (boxed warning).", notes: [d] }
      notes: { text: "More symptomatic hypotension than enalapril. Monitor potassium and renal function. eGFR <30: start at half the usual starting dose.", notes: [e] }
  - cells:
      drug_class: { text: "Pillar 1 alternative: ACEi", notes: [f] }
      examples: "Enalapril (Vasotec); lisinopril (Zestril)"
      trials: { text: "CONSENSUS; SOLVD-Treatment", notes: [g] }
      mortality: { text: "17", notes: [c, h] }
      avoid: { text: "Any history of angioedema, including hereditary or idiopathic. With sacubitril/valsartan, or within 36 h of switching. With aliskiren in diabetes. Pregnancy (boxed warning). Caution if low blood pressure, renal insufficiency, or potassium >5.0 mEq/L.", notes: [i] }
      notes: { text: "Cough and angioedema. Avoid abrupt withdrawal, which can cause clinical deterioration.", notes: [x] }
  - cells:
      drug_class: { text: "Pillar 1 alternative: ARB", notes: [j] }
      examples: "Candesartan (Atacand); valsartan (Diovan)"
      trials: { text: "CHARM-Alternative; Val-HeFT", notes: [k] }
      mortality: { text: "17", notes: [c, h] }
      avoid: { text: "With aliskiren in diabetes. Pregnancy (boxed warning). Caution if low blood pressure, renal insufficiency, or potassium >5.0 mEq/L.", notes: [l] }
      notes: { text: "Much less cough and angioedema than ACEi, but angioedema has occurred with ARB.", notes: [x] }
  - cells:
      drug_class: { text: "Pillar 2: Beta-blocker (evidence-based agents only)", notes: [m] }
      examples: "Bisoprolol; carvedilol (Coreg); metoprolol succinate (Toprol-XL)"
      trials: { text: "CIBIS-II; COPERNICUS; MERIT-HF", notes: [n] }
      mortality: { text: "34", notes: [c] }
      avoid: { text: "Second- or third-degree AV block. Sick sinus syndrome. Severe bradycardia without a permanent pacemaker. Cardiogenic shock or decompensated HF (carvedilol: needing IV inotropes). Carvedilol also: bronchial asthma or bronchospasm, severe hepatic impairment.", notes: [o] }
      notes: { text: "Start low and titrate to trial target doses. May start before discharge once stable and off IV inotropes. Avoid abrupt withdrawal.", notes: [p] }
  - cells:
      drug_class: "Pillar 3: MRA"
      examples: "Spironolactone (Aldactone); eplerenone (Inspra)"
      trials: { text: "RALES; EMPHASIS-HF", notes: [q] }
      mortality: { text: "30", notes: [c] }
      avoid: { text: "Do not start if eGFR ≤30 mL/min/1.73 m² or potassium ≥5.0 mEq/L. Stop if potassium cannot be kept <5.5 mEq/L.", notes: [r, s] }
      notes: { text: "Hyperkalemia: check potassium and renal function at about 1 week, 4 weeks, then every 6 months. eGFR 31 to 49: halve the dose. Gynecomastia with spironolactone; less often with eplerenone.", notes: [t] }
  - cells:
      drug_class: "Pillar 4: SGLT2i"
      examples: "Dapagliflozin (Farxiga); empagliflozin (Jardiance)"
      trials: { text: "DAPA-HF; EMPEROR-Reduced", notes: [u] }
      mortality: { text: "17", notes: [c] }
      avoid: { text: "Dapagliflozin: starting not recommended if eGFR <25 mL/min/1.73 m². Empagliflozin: trials did not enroll eGFR <20 mL/min/1.73 m² or dialysis. Type 1 diabetes was excluded from the HF trials.", notes: [v] }
      notes: { text: "Benefit with or without diabetes. Genital infections. Euglycemic ketoacidosis. Volume depletion: adjust diuretics if needed.", notes: [w] }
footnotes:
  - id: a
    text: "Class 1 for HFrEF with NYHA class II to III symptoms. Patients in NYHA class II or III who tolerate an ACEi or ARB should be switched to an ARNi."
    refs: [aha2022]
  - id: b
    text: "PARADIGM-HF: sacubitril/valsartan reduced the composite of cardiovascular death or HF hospitalization by 20% relative to enalapril."
    refs: [aha2022, paradigm]
  - id: c
    text: "Relative risk reduction in all-cause mortality in the pivotal RCTs, from guideline Table 15. The ARNi value is the benefit added to ACEi therapy; the other classes are compared with placebo."
    refs: [aha2022]
  - id: d
    text: "ARNi contraindications and boxed warning from the US label. The guideline lists ARNi with an ACEi, within 36 h of the last ACEi dose, or with any history of angioedema as Class 3 (harm). The label notes a higher rate of angioedema in Black patients than in non-Black patients."
    refs: [entresto, aha2022]
  - id: e
    text: "US label: start at half the usual starting dose if eGFR <30 mL/min/1.73 m²; no dose adjustment for eGFR 30 to 90."
    refs: [entresto, aha2022]
  - id: f
    text: "Class 1 when ARNi is not feasible."
    refs: [aha2022]
  - id: g
    text: "Both trials used enalapril. CONSENSUS enrolled patients with severe HF."
    refs: [consensus, solvd]
  - id: h
    text: "Table 15 gives a single value for ACEi or ARB."
    refs: [aha2022]
  - id: i
    text: "Contraindications and boxed warning from the US labels for enalapril and lisinopril. The guideline lists ACEi with any history of angioedema as Class 3 (harm) and advises caution with low blood pressure, renal insufficiency, or potassium >5.0 mEq/L."
    refs: [vasotec, zestril, aha2022]
  - id: j
    text: "Class 1 for patients intolerant of ACEi because of cough or angioedema when ARNi is not feasible."
    refs: [aha2022]
  - id: k
    text: "CHARM-Alternative studied candesartan in patients intolerant of ACEi. Val-HeFT studied valsartan."
    refs: [charm_alt, valheft]
  - id: l
    text: "Contraindications and boxed warning from the US labels for candesartan and valsartan. Cautions from the guideline."
    refs: [atacand, diovan, aha2022]
  - id: m
    text: "The guideline recommends 1 of the 3 beta-blockers proven to reduce mortality: bisoprolol, carvedilol, or sustained-release metoprolol succinate. The benefit is not considered a class effect, and other beta-blockers are not included in the recommendation."
    refs: [aha2022]
  - id: n
    text: "CIBIS-II studied bisoprolol, COPERNICUS carvedilol in severe chronic HF, and MERIT-HF metoprolol CR/XL."
    refs: [cibis2, copernicus, merit]
  - id: o
    text: "Contraindications from the US labels for carvedilol and metoprolol succinate. The metoprolol succinate label allows sick sinus syndrome when a permanent pacemaker is in place."
    refs: [coreg, toprol]
  - id: p
    text: "From the guideline. If a contraindication or intolerance is found, document it and retry later unless it is absolute."
    refs: [aha2022]
  - id: q
    text: "RALES studied spironolactone in highly symptomatic patients with LVEF ≤35%. EMPHASIS-HF studied eplerenone in mild symptoms with LVEF ≤30%. EPHESUS (eplerenone after MI) also supports MRA use."
    refs: [rales, emphasis, aha2022]
  - id: r
    text: "Guideline: Class 1 for NYHA class II to IV if eGFR >30 mL/min/1.73 m² and potassium <5.0 mEq/L. Discontinuing when potassium cannot be kept <5.5 mEq/L is Class 3 (harm)."
    refs: [aha2022]
  - id: s
    text: "US labels. Spironolactone is contraindicated with hyperkalemia, Addison disease, or eplerenone. Eplerenone is contraindicated with potassium >5.5 mEq/L at initiation, creatinine clearance ≤30 mL/min, or strong CYP3A inhibitors."
    refs: [aldactone, inspra]
  - id: t
    text: "Monitoring schedule and dose reduction from the guideline. The spironolactone label reports gynecomastia in about 9% of men in RALES. The guideline also suggests holding the MRA during diarrhea with dehydration or when the loop diuretic is interrupted."
    refs: [aha2022, aldactone]
  - id: u
    text: "Compared with placebo, both trials reduced cardiovascular death or HF hospitalization by about 25%, regardless of diabetes status."
    refs: [aha2022, dapahf, emperor]
  - id: v
    text: "From the US labels. The guideline notes the trials excluded eGFR <20 (EMPEROR-Reduced) or <30 mL/min/1.73 m² (DAPA-HF), type 1 diabetes, and systolic blood pressure below 95 to 100 mm Hg."
    refs: [farxiga, jardiance, aha2022]
  - id: w
    text: "From the guideline. The labels list surgery, acute febrile illness, reduced caloric intake, and volume depletion among conditions that can precipitate ketoacidosis."
    refs: [aha2022, farxiga, jardiance]
  - id: x
    text: "From the guideline."
    refs: [aha2022]
caveats:
  - "Applies to HFrEF (LVEF ≤40%). This table does not cover HF with mildly reduced or preserved ejection fraction."
  - "Start each drug at a low dose and titrate to the doses used in trials as tolerated. Doses are not listed here; see the guideline (Table 14)."
  - "Contraindications summarize US labeling and the 2022 AHA/ACC/HFSA guideline and are not complete. Check current local labeling."
  - "Trade names are US brand names and vary by country. Bisoprolol is listed by generic name only."
